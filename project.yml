name: Talaria

options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  HermesKit:
    path: Packages/HermesKit

targets:
  Talaria:
    type: application
    platform: iOS
    sources:
      - path: Talaria
      - path: Shared
    entitlements:
      path: Talaria/Talaria.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: HermesKit
        product: HermesKit
      - package: HermesKit
        product: MarkdownBlocks
      - target: TalariaActivity
    settings:
      base:
        INFOPLIST_FILE: Talaria/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: NO

  # The Live Activity: a running reply on the Lock Screen and in the Dynamic Island.
  TalariaActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: TalariaActivity
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: TalariaActivity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(TALARIA_BUNDLE_ID).activity
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  TalariaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TalariaUITests
    dependencies:
      - target: Talaria
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TALARIA_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Talaria
        TARGETED_DEVICE_FAMILY: "1,2"

  # Tests of the app's own models hosted in the app, against a loopback stand-in for the gateway.
  TalariaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TalariaTests
    dependencies:
      - target: Talaria
      - package: HermesKit
        product: HermesKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TALARIA_BUNDLE_ID).tests
        TEST_TARGET_NAME: Talaria
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Talaria:
    build:
      targets:
        Talaria: all
        TalariaTests: [test]
        TalariaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TalariaTests
        - TalariaUITests
    archive:
      config: Release
